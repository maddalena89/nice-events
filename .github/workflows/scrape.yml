name: Scrape and publish

on:
  schedule:
    - cron: "0 4 * * *"        # 04:00 UTC = 06:00 Nice in summer (05:00 in winter)
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["niceevents/**", "templates/**", ".github/workflows/**"]

permissions:
  contents: write              # to commit the refreshed db
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Test
        run: pytest tests/ -q

      # A source can break without the run failing — we still want the other
      # 7 sources published. `|| true` keeps a partial scrape useful; the step
      # summary below is where you actually see what broke.
      # SUPABASE_SERVICE_KEY bypasses Row Level Security, so it is scoped to this
      # step alone — the step that reads approved submissions. It is deliberately
      # NOT present in "Build site" below, because that step renders a public HTML
      # file and nothing that can read submitter emails belongs anywhere near it.
      - name: Scrape
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m niceevents.run scrape -v 2>&1 | tee scrape.log || true

      # Only the anon key here. Both of these end up inside index.html by design;
      # see the note in site.py.
      - name: Build site
        env:
          SITE_TITLE: "What's on in Nice"
          GITHUB_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # SUBMIT_ENDPOINT: ${{ secrets.SUBMIT_ENDPOINT }}   # if you use Formspree
        run: python -m niceevents.run build --out dist

      # dist/sources.json joins what each scraper FETCHED (the runs table, which
      # only ever existed inside this runner) to what actually reached the feed.
      # It ships with the site, so whatsonnice.com/sources.json is a permanent
      # outside view of source health — the thing that was missing when three
      # scrapers sat at zero for a week without anyone noticing.
      - name: Report
        if: always()
        run: |
          {
            echo "### Source health"
            if [ -f dist/sources.json ]; then
              python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("dist/sources.json").read_text())
          rank = {"failed": 0, "stale": 1, "empty": 2, "ok": 3}
          rows = sorted(d["sources"], key=lambda s: (rank[s["status"]], -(s["published"] or 0)))
          print(f'{d["published_total"]} events published\n')
          print("| source | status | published | found | note |")
          print("| --- | --- | --- | --- | --- |")
          for s in rows:
              mark = {"failed": "🔴", "stale": "🟠", "empty": "⚪️", "ok": "🟢"}[s["status"]]
              note = (s["error"] or "")[:70] or ("not registered" if not s["registered"] else "")
              print(f'| {s["name"]} | {mark} {s["status"]} | {s["published"]} | '
                    f'{s["found"] if s["found"] is not None else "-"} | {note} |')
          bad = [s["name"] for s in rows if s["status"] in ("failed", "stale")]
          if bad:
              print(f'\n⚠️ needs attention: {", ".join(bad)}')
          PY
            else
              echo "no sources.json — the build step did not finish"
            fi
            echo ""
            echo "<details><summary>scrape log</summary>"
            echo ""
            echo '```'
            tail -25 scrape.log || echo "no log"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Saving the db is a nice-to-have (it's what makes "new this week" work).
      # If the push ever conflicts, that must NOT stop the site from deploying —
      # a stale database is a small problem, a site that won't publish is a big one.
      - name: Commit database
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/events.db
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
