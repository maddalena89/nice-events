name: Scrape and publish

on:
  schedule:
    - cron: "0 4 * * *"        # 04:00 UTC = 06:00 Nice in summer (05:00 in winter)
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      mode:
        description: >-
          full = re-read every source (about 35 minutes).
          submissions = only publish approved submissions (about 3 minutes).
        type: choice
        options: [full, submissions]
        default: full
  push:
    branches: [main]
    paths: ["niceevents/**", "templates/**", ".github/workflows/**"]

permissions:
  contents: write              # to commit the refreshed db
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only a full scrape needs a browser. Installing Chromium and its system
      # packages is a minute or two on its own, and approved submissions are a
      # plain web request, so the fast mode skips it.
      - name: Install
        run: |
          pip install -r requirements.txt
          if [ "${{ inputs.mode }}" != "submissions" ]; then
            playwright install --with-deps chromium
          fi

      - name: Test
        run: pytest tests/ -q

      # A source can break without the run failing — we still want the other
      # 7 sources published. `|| true` keeps a partial scrape useful; the step
      # summary below is where you actually see what broke.
      # SUPABASE_SERVICE_KEY bypasses Row Level Security, so it is scoped to this
      # step alone — the step that reads approved submissions. It is deliberately
      # NOT present in "Build site" below, because that step renders a public HTML
      # file and nothing that can read submitter emails belongs anywhere near it.
      - name: Scrape
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # mode=submissions is what Supabase asks for when a submission is approved
        # (migration 008). It reads approved submissions only; every other source's
        # events come from the database the last full run committed. --only also
        # skips clearing out retired sources, so a fast run can never remove
        # anything a full run put there. Scheduled and push runs have no inputs,
        # so they always take the full branch.
        run: |
          if [ "${{ inputs.mode }}" = "submissions" ]; then
            python -m niceevents.run scrape -v --only submissions 2>&1 | tee scrape.log || true
          else
            python -m niceevents.run scrape -v 2>&1 | tee scrape.log || true
          fi

      # Only the anon key here. Both of these end up inside index.html by design;
      # see the note in site.py.
      - name: Build site
        env:
          SITE_TITLE: "What's on in Nice"
          GITHUB_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # SUBMIT_ENDPOINT: ${{ secrets.SUBMIT_ENDPOINT }}   # if you use Formspree
        run: python -m niceevents.run build --out dist

      - name: Report
        if: always()
        run: |
          {
            echo "### Scrape result"
            echo '```'
            tail -25 scrape.log || echo "no log"
            echo '```'
            grep -iE "FAILED|returned NOTHING" scrape.log && echo "⚠️ some sources need attention" || true
          } >> "$GITHUB_STEP_SUMMARY"

      # Saving the db is a nice-to-have (it's what makes "new this week" work).
      # If the push ever conflicts, that must NOT stop the site from deploying —
      # a stale database is a small problem, a site that won't publish is a big one.
      - name: Commit database
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/events.db
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
